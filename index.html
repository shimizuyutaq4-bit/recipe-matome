   2) ブログ → 本文から推測抽出

   材料費は内蔵の価格表による「ざっくり概算」
   ========================================================= */

/* ---------- CORSプロキシ ----------
   サイトによって効くプロキシが違うため、複数を同時に投げて
   「最初に正しく取れたもの」を採用する（並列レース）。
   壊れた応答（短すぎ／HTMLでない）は無効として捨てる。
   将来は自前のCloudflare Workerを先頭に足せば安定＆高速になる。 */
const PROXIES = [
  u => `https://proxy.cors.sh/${u}`,
  u => `https://api.cors.lol/?url=${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://cors.eu.org/${u}`,
];
function looksValidHtml(t){
  return !!t && t.length >= 3000 && /<html|<\/html>|<body|application\/ld\+json/i.test(t);
}
async function fetchHtml(url){
  const attempts = PROXIES.map(mk => {
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 11000);
    return fetch(mk(url), {signal:ctrl.signal, redirect:'follow'})
      .then(async r => {
        const t = await r.text();
        if(r.ok && looksValidHtml(t)) return t;   // プロキシ／対象のエラー応答（403/429等）は捨てる
        throw new Error('status '+r.status);
      })
      .finally(()=> clearTimeout(timer));
  });
  try{
    return await Promise.any(attempts);
  }catch(e){
    throw new Error('ALL_PROXIES_FAILED');
  }
}

const UNIT_ALIAS = {
  'g':'g','グラム':'g','ｇ':'g',
  '大さじ':'大さじ','おおさじ':'大さじ','大匙':'大さじ',
  '小さじ':'小さじ','こさじ':'小さじ','小匙':'小さじ',
  'ml':'ml','cc':'ml','ｍｌ':'ml','mL':'ml','ミリ':'ml',
  '個':'個','コ':'個','こ':'個',
  '枚':'枚','本':'本','切れ':'切れ','切':'切れ','尾':'切れ',
  '丁':'丁','パック':'パック','缶':'缶','袋':'袋','束':'束',
  '片':'片','かけ':'かけ','カケ':'かけ','玉':'玉','株':'株','節':'節','合':'合','cm':'cm','センチ':'cm',
  '少々':'少々','適量':'適量','ひとつまみ':'少々','お好み':'少々',
};

/* 全角数字→半角、漢数字ざっくり、分数「1と1/2」対応 */
function toNum(s){
  if(!s) return null;
  s = s.replace(/[０-９]/g, d => '0123456789'['０１２３４５６７８９'.indexOf(d)])
       .replace(/½/g,'1/2').replace(/¼/g,'1/4').replace(/⅓/g,'1/3').replace(/¾/g,'3/4');
  // 「1と1/2」「1 1/2」
  let m = s.match(/(\d+)\s*(?:と|\s)\s*(\d+)\/(\d+)/);
  if(m) return (+m[1]) + (+m[2])/(+m[3]);
  m = s.match(/(\d+)\/(\d+)/);
  if(m) return (+m[1])/(+m[2]);
  m = s.match(/\d+(?:\.\d+)?/);
  if(m) return parseFloat(m[0]);
  return null;
}

/* 分量テキスト → {value, unit}   例:"大さじ1と1/2"→{1.5,'大さじ'} , "1枚(300g)"→{300,'g'} */
function parseQuantity(raw){
  if(!raw) return null;
  let t = raw.replace(/\s/g,'');
  // かっこ内にg表記があれば優先（例 1枚(300g)）
  let mg = t.match(/[（(]\s*(約?\d[\d./]*)\s*(g|ｇ|グラム|ml|cc)\s*[)）]/);
  if(mg){ const v=toNum(mg[1]); if(v!=null) return {value:v, unit:UNIT_ALIAS[mg[2]]||mg[2]}; }
  // 大さじ/小さじ が先に来るパターン
  let m = t.match(/(大さじ|小さじ|大匙|小匙)\s*(\d[\d./とと\s]*)/);
  if(m){ const v=toNum(m[2]); if(v!=null) return {value:v, unit:UNIT_ALIAS[m[1]]}; }
  // 数字 + 単位（後置）
  m = t.match(/(約?\d[\d./]*(?:と\d\/\d)?)\s*(g|ｇ|グラム|ml|cc|ｍｌ|個|コ|枚|本|切れ|切|尾|丁|パック|缶|袋|束|片|かけ|玉|株|節|合|cm|センチ)/);
  if(m){ const v=toNum(m[1]); if(v!=null) return {value:v, unit:UNIT_ALIAS[m[2]]||m[2]}; }
  // 少々/適量など
  if(/少々|適量|ひとつまみ|お好み|適宜/.test(t)) return {value:1, unit:'少々'};
  // 数字のみ（単位不明）
  const v = toNum(t);
  if(v!=null) return {value:v, unit:'個'}; // 個数とみなす
  return null;
}

function findPrice(name){
  // 【A】や(冷凍)などの注記を除去。先頭の材料グループ記号（例「A砂糖」のA）だけを慎重に除去
  const n = name
    .replace(/【[^】]*】|\[[^\]]*\]|[（(][^)）]*[)）]/g,'')
    .replace(/^[A-Za-zＡ-Ｚａ-ｚ](?=[ぁ-んァ-ヶ一-龯々])/,'')
    .trim();
  // マッチしたキーワードが最も長い（＝最も具体的な）エントリを採用
  let best=null, bestLen=0;
  for(const p of PRICE){
    for(const key of p.k){
      if(key.length>bestLen && n.includes(key)){ best=p; bestLen=key.length; }
    }
  }
  return best;
}

/* 材料1行のコスト概算 → {cost, known} */
function estimateCost(name, amount){
  const p = findPrice(name);
  if(!p) return {cost:0, known:false};
  const q = parseQuantity(amount);
  if(!q){ // 分量不明 → 単位系から最小1個ぶんで概算
    const u = p.u;
    const base = u.個||u.枚||u.本||u.g&&u.g*100||u.大さじ||u.小さじ||u.パック||30;
    return {cost:Math.round(base), known:true, rough:true};
  }
  const u = p.u;
  if(q.unit==='少々'){ return {cost:Math.round((u.少々||u.小さじ||5)), known:true}; }
  if(u[q.unit]!=null){ return {cost:Math.round(u[q.unit]*q.value), known:true}; }
  // 単位変換フォールバック
  if(q.unit==='g' && u.g!=null) return {cost:Math.round(u.g*q.value), known:true};
  if(q.unit==='ml' && u.ml!=null) return {cost:Math.round(u.ml*q.value), known:true};
  if(q.unit==='大さじ' && u.小さじ!=null) return {cost:Math.round(u.小さじ*3*q.value), known:true};
  if(q.unit==='小さじ' && u.大さじ!=null) return {cost:Math.round(u.大さじ/3*q.value), known:true};
  // その手の単位が無い→代表単価
  const any = u.個||u.枚||u.本||u.大さじ||u.g&&u.g*50||30;
  return {cost:Math.round(any*(q.value||1)), known:true, rough:true};
}

/* ---------- ISO8601 duration → 分 ---------- */
function isoToMin(iso){
  if(!iso || typeof iso!=='string') return null;
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if(!m) return null;
  const h=+(m[1]||0), mi=+(m[2]||0), s=+(m[3]||0);
  const total = h*60 + mi + Math.round(s/60);
  return total>0 ? total : null;
}

/* ========== 抽出：JSON-LD ========== */
function extractJsonLd(doc){
  const scripts = [...doc.querySelectorAll('script[type="application/ld+json"]')];
  const recipes = [];
  for(const s of scripts){
    let data; try{ data = JSON.parse(s.textContent); }catch(e){ continue; }
    const stack = Array.isArray(data)?[...data]:[data];
    while(stack.length){
      const it = stack.shift();
      if(!it || typeof it!=='object') continue;
      if(Array.isArray(it['@graph'])) stack.push(...it['@graph']);
      const t = it['@type'];
      const isR = t==='Recipe' || (Array.isArray(t)&&t.includes('Recipe'));
      if(isR) recipes.push(it);
    }
  }
  if(!recipes.length) return null;
  const r = recipes[0];
  const ings = (r.recipeIngredient || r.ingredients || []).map(x=>splitIngredient(String(x)));
  let author = '';
  if(r.author){ author = Array.isArray(r.author)? (r.author[0]&&r.author[0].name)||'' : (r.author.name||r.author||''); }
  let img = '';
  if(r.image){ img = Array.isArray(r.image)? (r.image[0].url||r.image[0]) : (r.image.url||r.image); }
  const time = isoToMin(r.totalTime) || isoToMin(r.cookTime) || isoToMin(r.prepTime);
  return {
    source:'jsonld',
    title: (r.name||'').trim(),
    author: (author||'').trim(),
    image: img||'',
    servings: (r.recipeYield? (Array.isArray(r.recipeYield)?r.recipeYield[0]:r.recipeYield):'').toString(),
    timeMin: time,
    ingredients: ings,
  };
}

/* 材料名の先頭に付く「グループ記号」を除去
   例: "A醤油"→"醤油", "☆砂糖"→"砂糖", "【A】みりん"→"みりん", "(B)塩"→"塩" */
function cleanName(name){
  let n = String(name).trim();
  let prev;
  do{
    prev = n;
    n = n
      .replace(/^【[^】]*】/,'')                                   // 【A】など
      .replace(/^[︎️]+/,'')                              // 異体字セレクタ
      .replace(/^[☆★●◎○◇◆■□▲△▼▽◯・･※＊*＋+\-–—⭐✩✪✦✧♦◆]+[︎️]?\s*/,'') // 記号マーカー
      .replace(/^[（(＜<「][A-Za-zＡ-Ｚａ-ｚ0-9０-９]{1,3}[)）＞>」]\s*/,'')   // (A) ＜A＞ など
      .replace(/^[A-Za-zＡ-Ｚａ-ｚ][.:：、]?(?=[ぁ-んァ-ヶ一-龯々])/,'') // 先頭1文字の英字グループ記号（後ろが日本語のときだけ）
      .trim();
  }while(n!==prev && n);
  return n || String(name).trim();
}

/* 材料文字列 "醤油 大さじ3" / "醤油…大さじ3" → {name, amount} */
function splitIngredient(str){
  let s = String(str).replace(/\s+/g,' ').trim();
  const done = (name, amount)=>({name:cleanName(name), amount:(amount||'').trim()});
  // 強い区切り記号（… ： : ‥）で分ける
  let d = s.split(/[：:…‥]{1,}/);
  if(d.length>=2 && d[d.length-1].trim()){
    const amount = d.pop().trim();
    return done(d.join(' ').trim(), amount);
  }
  // 空白区切りで、末尾トークンが分量っぽければそこで分ける
  if(/\s/.test(s)){
    const parts = s.split(' ');
    const last = parts[parts.length-1];
    if(/^(大さじ|小さじ)|[0-9０-９]|少々|適量|ひとつまみ|お好み|適宜/.test(last) && parts.length>1){
      return done(parts.slice(0,-1).join(' ').trim(), last.trim());
    }
  }
  // 連結型（名前と数量がくっついている）：末尾の数量を分離
  let m = s.match(/^(.*?[^\d\s０-９])((?:大さじ|小さじ)?約?[0-9０-９][\d０-９./とと]*\s*(?:g|ｇ|グラム|ml|cc|個|コ|枚|本|切れ|切|尾|丁|パック|缶|袋|束|片|かけ|玉|株|節|合|cm|センチ)?|少々|適量|ひとつまみ|お好み|適宜)$/);
  if(m && m[1].trim()) return done(m[1].trim(), m[2]||'');
  return done(s, '');
}

/* ========== 抽出：ブログ本文（推測） ========== */
function extractBlog(doc, url){
  // 本文候補
  let body = doc.querySelector('[data-uranus-component="entryBody"], .skin-entryBody, #entryBody, article, .article-body, .entry-content, main');
  const root = body || doc.body;
  // ブロック要素を改行に変換してテキスト化
  const clone = root.cloneNode(true);
  clone.querySelectorAll('script,style,noscript').forEach(n=>n.remove());
  clone.querySelectorAll('br').forEach(n=>n.replaceWith('\n'));
  clone.querySelectorAll('p,div,li,tr,h1,h2,h3,h4').forEach(n=>{ n.append('\n'); });
  let text = (clone.textContent||'').replace(/ /g,' ').replace(/[ \t]+/g,' ');
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l);

  const title = (doc.querySelector('meta[property="og:title"]')?.content
              || doc.querySelector('title')?.textContent || '').trim().replace(/｜.*$| \| .*$/,'').trim();
  const author = (doc.querySelector('meta[property="og:site_name"]')?.content
              || doc.querySelector('meta[name="author"]')?.content || '').trim();
  const image = doc.querySelector('meta[property="og:image"]')?.content || '';

  // 「材料」行を探す
  let start = lines.findIndex(l=>/材料/.test(l) && l.length<40);
  let servings = '';
  const ings = [];
  if(start>=0){
    const sv = lines[start].match(/([0-9０-９]+[〜~ー]?[0-9０-９]*)\s*(人分|人前|個分|枚分)/);
    if(sv) servings = sv[1]+sv[2];
    for(let i=start+1; i<lines.length && i<start+40; i++){
      const l = lines[i];
      // 手順の始まりで打ち切り
      if(/^(作り方|つくり方|手順|レシピ|【作り方】|作\s*り\s*方)/.test(l)) break;
      if(/^[①-⑳]|^[0-9]+[\.．、）\)]\s*\S/.test(l) && !/[…：:]/.test(l)) break;
      // 注記行（※ や「ポイント」など）はスキップ
      if(/^[※*＊]|ポイント|コツ/.test(l)) continue;
      // 材料行っぽいか：区切りor数量を含む、記号始まり
      const looksIng = /[…：:・]/.test(l) || /(大さじ|小さじ|\d[\d./]*\s*(g|ml|cc|個|枚本切丁本袋束缶片玉合本)|少々|適量)/.test(l);
      const bulleted = /^[・･*＊\-–—◆●○▲A-Ｚ]/.test(l);
      if(looksIng || bulleted){
        const cleaned = l.replace(/^[・･*＊\-–—◆●○▲\s]+/,'').replace(/^【[^】]*】/,'').trim();
        if(cleaned && !/^材料/.test(cleaned)){
          const ing = splitIngredient(cleaned);
          ing.amount = (ing.amount||'').split(/[。「]/)[0].trim(); // 分量の後ろの説明文を除去（かっこ内gは残す）
          ings.push(ing);
        }
      } else if(ings.length>0 && l.length>30){
        break; // 長い説明文が来たら材料終わりとみなす
      }
    }
  }
  // 調理時間（あれば）
  let timeMin = null;
  const tm = text.match(/(調理時間|所要時間|時間)[^0-9]{0,6}([0-9０-９]+)\s*分/);
  if(tm) timeMin = parseInt(tm[2].replace(/[０-９]/g,d=>'0123456789'['０１２３４５６７８９'.indexOf(d)]));

  return {
    source:'blog',
    title, author, image,
    servings, timeMin,
    ingredients: ings,
  };
}

/* ========== メイン抽出 ========== */
async function importFromUrl(url){
  const html = await fetchHtml(url);
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let r = extractJsonLd(doc);
  if(!r || !r.ingredients.length) {
    const b = extractBlog(doc, url);
    // JSON-LDでタイトルだけ取れていれば活かす
    if(r && r.title && !b.title) b.title = r.title;
    r = b;
  }
  r.url = url;
  return r;
}

/* 選択状態（選んだレシピの合計用） */
const SELKEY='recipe_matome_sel_v1';
function loadSel(){ try{ return new Set(JSON.parse(localStorage.getItem(SELKEY)||'[]')); }catch(e){ return new Set(); } }
function saveSel(s){ localStorage.setItem(SELKEY, JSON.stringify([...s])); }

/* 合計コスト計算 */
function recipeCost(r){
  let total=0, unknown=0;
  (r.ingredients||[]).forEach(ing=>{
    const e = estimateCost(ing.name, ing.amount);
    ing._cost = e.cost; ing._known = e.known; ing._rough = e.rough;
    if(e.known) total += e.cost; else unknown++;
  });
  return {total, unknown};
}

async function doImport(){
  const url = document.getElementById('urlIn').value.trim();
  if(!/^https?:\/\//.test(url)){ toast('URLを入力してください'); return; }
  const btn = document.getElementById('goImport');
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>読み込み中...';
  const isCookpad = /cookpad\.com/.test(url);
  try{
    const r = await importFromUrl(url);
    if(!r.title && !r.ingredients.length){ toast('自動では読み取れませんでした。手入力で仕上げてください'); }
    if(!r.ingredients.length) r.ingredients=[{name:'',amount:''}];
    currentDraft = r;
    location.hash = '#edit/new';
  }catch(e){
    console.error(e);
    // 失敗してもURLを引き継いで手入力画面へ（入力を無駄にしない）
    const msg = e.message==='ALL_PROXIES_FAILED'
      ? (isCookpad
          ? 'クックパッドは自動読み込みに対応できません（課金・保護のため）。手入力で追加できます'
          : 'このサイトは自動で読み込めませんでした。手入力で追加できます')
      : '読み込み失敗：'+(e.message||'ネットワークエラー');
    toast(msg);
    currentDraft = {source:'manual', title:'', author:'', image:'', servings:'', timeMin:null, ingredients:[{name:'',amount:''}], url:url};
    location.hash = '#edit/new';
  }finally{
    btn.disabled=false; btn.innerHTML='🔍 読み込む';
  }
}

  function refreshCost(){
    const igs = readIngs(); let total=0, unk=0;
    igs.forEach(ig=>{ if(!ig.name.trim())return; const e=estimateCost(ig.name,ig.amount); if(e.known)total+=e.cost; else unk++; });
    document.getElementById('costPreview').innerHTML =
      `💰 概算材料費：<b>${yen(total)}</b>${unk?` <span class="muted">（${unk}品は価格表に無く概算外）</span>`:''}`;
  }
  ingsEl.addEventListener('input', refreshCost);
  ingsEl.addEventListener('click', e=>{
    if(e.target.classList.contains('del')){ e.target.closest('.ing').remove(); refreshCost(); }
  });
  document.getElementById('addIng').onclick=()=>{
    const div=document.createElement('div'); div.className='ing';
    div.innerHTML=`<input class="nm" data-f="name" placeholder="材料名"><input class="am" data-f="amount" style="max-width:110px" placeholder="分量"><button class="del">×</button>`;
    ingsEl.appendChild(div); div.querySelector('.nm').focus();
  };
  refreshCost();

  document.getElementById('cancelBtn').onclick=()=>{ history.length>1?history.back():(location.hash='#list'); };
  document.getElementById('saveBtn').onclick=()=>{
    const rec = {
      id: r.id, source: r.source,
      title: document.getElementById('f_title').value.trim(),
      author: document.getElementById('f_author').value.trim(),
      servings: document.getElementById('f_serv').value.trim(),
      timeMin: document.getElementById('f_time').value? parseInt(document.getElementById('f_time').value):null,
      image: document.getElementById('f_img').value.trim(),
      url: document.getElementById('f_url').value.trim(),
      ingredients: readIngs().filter(ig=>ig.name.trim()),
    };
    if(!rec.title){ toast('料理名を入力してください'); return; }
    if(id==='new'){ rec.source = r.source; const nid=addRecipe(rec); toast('保存しました'); currentDraft=null; location.hash='#detail/'+nid; }
    else { updateRecipe(rec); toast('更新しました'); location.hash='#detail/'+rec.id; }
  };
  const db=document.getElementById('deleteBtn');
  if(db) db.onclick=()=>{ if(confirm('このレシピを削除しますか？')){ delRecipe(r.id); toast('削除しました'); location.hash='#list'; } };
}

function viewDetail(id){
  const r = getRecipe(id);
  if(!r){ location.hash='#list'; return; }
  const c = recipeCost(r);
  const ingHtml = (r.ingredients||[]).map(ing=>{
    const cost = ing._known ? (ing._rough?'≈':'')+yen(ing._cost) : '—';
    const cls = ing._known? 'cost' : 'cost unk';
    return `<div class="ing"><span class="nm">${esc(ing.name)}</span><span class="am">${esc(ing.amount)}</span><span class="${cls}">${cost}</span></div>`;
  }).join('');
  const thumb = r.image? `<img class="thumb" style="width:100%;height:180px;border-radius:14px" src="${esc(r.image)}" onerror="this.remove()">`:'';
  app.innerHTML = `
    ${thumb}
    <h2 class="sec" style="margin-top:14px">${badgeFor(r.source)}</h2>
    <h1 style="font-size:20px;margin:2px 0 4px">${esc(r.title||'（無題）')}</h1>
    <div class="muted" style="font-size:13px">${r.author?('👨‍🍳 '+esc(r.author)+' ・ '):''}${r.servings?esc(r.servings):''}</div>
    <div class="stat-row" style="margin-top:12px">
      <div class="stat"><div class="n">${r.timeMin?r.timeMin+'分':'—'}</div><div class="k">調理時間</div></div>
      <div class="stat"><div class="n">${c.total?yen(c.total):'—'}</div><div class="k">材料費(概算)</div></div>
      <div class="stat"><div class="n">${(r.ingredients||[]).length}</div><div class="k">材料数</div></div>
    </div>
    <div class="card"><div>${ingHtml||'<span class="muted">材料なし</span>'}</div>
      ${c.unknown?`<p class="hint">※ ${c.unknown}品は価格表に無いため概算に含めていません。「≈」は分量が曖昧なための粗い概算です。</p>`:''}
    </div>
    ${r.url?`<p><a class="src" href="${esc(r.url)}" target="_blank" rel="noopener">🔗 元のレシピを開く</a></p>`:''}
    <div class="row2" style="margin-top:8px">
      <button class="btn sub" onclick="location.hash='#list'">← 一覧へ</button>
      <button class="btn" onclick="location.hash='#edit/${r.id}'">✏️ 編集</button>
    </div>`;
}

/* ============ ルーティング ============ */
function router(){
  const h = location.hash.replace(/^#/,'') || 'list';
  const [route, arg] = h.split('/');
  window.scrollTo(0,0);
  if(route==='add') return viewAdd();
  if(route==='edit') return viewEdit(arg);
  if(route==='detail') return viewDetail(arg);
  return viewList();
}
window.addEventListener('hashchange', router);
document.getElementById('fab').onclick=()=>location.hash='#add';
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>location.hash='#'+t.dataset.nav);

/* 既に保存済みのレシピの材料名もクリーニング（「A醤油」→「醤油」等） */
(function migrateNames(){
  const l = load(); let changed=false;
  l.forEach(r=>(r.ingredients||[]).forEach(ing=>{
    const c = cleanName(ing.name||'');
    if(c && c!==ing.name){ ing.name=c; changed=true; }
  }));
  if(changed) save(l);
})();

router(); updateCount();
</script>
</body>
</html>
